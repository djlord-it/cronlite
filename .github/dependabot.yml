version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      go-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["ci"]
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
